name: CI/CD

on:
  pull_request:
    branches:
      - domnus
      - officina
  push:
    branches:
      - domnus
      - officina

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SOLUTION_PATH: ./endpoint
  DOCKERFILE_CONTEXT: .

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for Nerdbank.GitVersioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install Nerdbank.GitVersioning
      run: dotnet tool install -g nbgv

    - name: Set version
      id: nbgv
      run: |
        nbgv cloud
        echo "version=$(nbgv get-version -v SemVer2)" >> $GITHUB_OUTPUT

    - name: Install CSharpier
      run: dotnet tool install -g csharpier

    - name: Check CSharpier formatting
      working-directory: ${{ env.SOLUTION_PATH }}
      run: csharpier check .

    - name: Restore dependencies
      working-directory: ${{ env.SOLUTION_PATH }}
      run: dotnet restore

    - name: Build
      working-directory: ${{ env.SOLUTION_PATH }}
      run: dotnet build --no-restore --configuration Release

    - name: Check dotnet format
      working-directory: ${{ env.SOLUTION_PATH }}
      run: dotnet format style . --verify-no-changes --verbosity diagnostic --no-restore

    - name: Run unit tests
      working-directory: ${{ env.SOLUTION_PATH }}
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults --settings .runsettings

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ${{ env.SOLUTION_PATH }}/TestResults/**/*.trx

    - name: Upload coverage results
      # if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-results
        path: ${{ env.SOLUTION_PATH }}/TestResults/**/coverage.cobertura.xml

  coverage:
    name: Upload Coverage to Coveralls
    runs-on: ubuntu-latest
    needs: build-and-test
    # if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Download coverage results
      uses: actions/download-artifact@v4
      with:
        name: coverage-results
        path: ./TestResults

    - name: Merge coverage reports
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator -reports:TestResults/**/coverage.cobertura.xml \
                        -targetdir:CoverallsOutput \
                        -reporttypes:Cobertura

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        file: CoverallsOutput/Cobertura.xml

  docker-build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/domnus' || github.ref == 'refs/heads/officina')
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install Nerdbank.GitVersioning
      run: dotnet tool install -g nbgv

    - name: Get version
      id: nbgv
      run: echo "version=$(nbgv get-version -v SemVer2)" >> $GITHUB_OUTPUT

    - name: Determine branch tag
      id: branch
      run: |
        if [ "${{ github.ref }}" == "refs/heads/domnus" ]; then
          echo "tag=latest" >> $GITHUB_OUTPUT
        else
          echo "tag=dev" >> $GITHUB_OUTPUT
        fi

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}},value=${{ steps.nbgv.outputs.version }}
          type=semver,pattern={{major}}.{{minor}},value=${{ steps.nbgv.outputs.version }}
          type=sha,prefix={{branch}}-
          type=raw,value=${{ steps.branch.outputs.tag }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ env.DOCKERFILE_CONTEXT }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ steps.nbgv.outputs.version }}